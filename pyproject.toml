# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "advent-of-code-python"
version = "0.0.0"
description = "Python solutions to the Advent of Code problem sets."
authors = [{name = "billwallis"}]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "arguably>=1.0.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
]

[project.scripts]
aoc = "advent_of_code.__main__:arguably.run"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyyaml>=6.0.0",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.13.5",
    "pytest>=9.0.3",
]


[tool.setuptools]
packages = ["advent_of_code"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage]
run.source = ["advent_of_code", "tests"]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 80
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]
